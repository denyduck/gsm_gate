
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_SHARED_BUFFERS: 64MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 128MB
      POSTGRES_MAX_CONNECTIONS: "20"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gsm_network
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d user"]
      interval: 5s
      timeout: 5s
      retries: 10


  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.cz
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    networks:
      - gsm_network
    depends_on:
      db:
        condition: service_healthy

  web:
    container_name: django_app
    restart: unless-stopped
    build:
      context: ./django_app
      dockerfile: Dockerfile_django
    volumes:
      - ./django_app:/usr/src/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_NAME=user
      - DATABASE_USER=user
      - DATABASE_PASSWORD=user
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-CHANGE-ME-please-set-DJANGO_SECRET_KEY-env-var}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-10.10.10.234,localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://10.10.10.234:8000,http://localhost:8000,http://127.0.0.1:8000}
      - MKDOCS_BASE_URL=${MKDOCS_BASE_URL:-http://10.10.10.234:8010}
      - GSM_ENABLED=${GSM_ENABLED:-false}
      - GSM_MODEM_PORT=${GSM_MODEM_PORT:-/dev/ttyUSB0}
      - GSM_MODEM_BAUD=${GSM_MODEM_BAUD:-115200}
      - GSM_WORKER_INTERVAL=${GSM_WORKER_INTERVAL:-10}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gsm_network

    command: sh -c "python manage.py collectstatic --noinput --clear && gunicorn gsm_gate.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3}"

  gsm_worker:
    container_name: gsm_worker
    build:
      context: ./django_app
      dockerfile: Dockerfile_django
    volumes:
      - ./django_app:/usr/src/app
      - /run/dbus:/run/dbus
    environment:
      - DATABASE_NAME=user
      - DATABASE_USER=user
      - DATABASE_PASSWORD=user
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-CHANGE-ME-please-set-DJANGO_SECRET_KEY-env-var}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - GSM_ENABLED=${GSM_ENABLED:-true}
      - GSM_WORKER_INTERVAL=${GSM_WORKER_INTERVAL:-10}
      - GSM_MAX_ACTIONS_PER_CYCLE=${GSM_MAX_ACTIONS_PER_CYCLE:-30}
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py gsm_gateway_worker --interval ${GSM_WORKER_INTERVAL:-10}
    restart: unless-stopped
    networks:
      - gsm_network
    profiles:
      - rpi
volumes:
  postgres_data:
networks:
  gsm_network:
    driver: bridge