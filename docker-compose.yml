
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_SHARED_BUFFERS: 64MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 128MB
      POSTGRES_MAX_CONNECTIONS: "20"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gsm_network
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d user"]
      interval: 5s
      timeout: 5s
      retries: 10


  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.cz
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    networks:
      - gsm_network
    depends_on:
      db:
        condition: service_healthy

  web:
    container_name: django_app
    build:
      context: ./django_app
      dockerfile: Dockerfile_django
    volumes:
      - ./django_app:/usr/src/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_NAME=user
      - DATABASE_USER=user
      - DATABASE_PASSWORD=user
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - GSM_ENABLED=${GSM_ENABLED:-false}
      - GSM_MODEM_PORT=${GSM_MODEM_PORT:-/dev/ttyUSB0}
      - GSM_MODEM_BAUD=${GSM_MODEM_BAUD:-115200}
      - GSM_WORKER_INTERVAL=${GSM_WORKER_INTERVAL:-10}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gsm_network

    command: python manage.py runserver 0.0.0.0:8000

  gsm_worker:
    container_name: gsm_worker
    build:
      context: ./django_app
      dockerfile: Dockerfile_django
    volumes:
      - ./django_app:/usr/src/app
    environment:
      - DATABASE_NAME=user
      - DATABASE_USER=user
      - DATABASE_PASSWORD=user
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - GSM_ENABLED=${GSM_ENABLED:-true}
      - GSM_MODEM_PORT=${GSM_MODEM_PORT:-/dev/ttyUSB0}
      - GSM_MODEM_BAUD=${GSM_MODEM_BAUD:-115200}
      - GSM_WORKER_INTERVAL=${GSM_WORKER_INTERVAL:-10}
      - GSM_MAX_ACTIONS_PER_CYCLE=${GSM_MAX_ACTIONS_PER_CYCLE:-30}
    depends_on:
      db:
        condition: service_healthy
    devices:
      - "${GSM_MODEM_PORT:-/dev/ttyUSB0}:${GSM_MODEM_PORT:-/dev/ttyUSB0}"
    command: python manage.py gsm_gateway_worker --interval ${GSM_WORKER_INTERVAL:-10}
    restart: unless-stopped
    networks:
      - gsm_network
    profiles:
      - rpi
volumes:
  postgres_data:
networks:
  gsm_network:
    driver: bridge