{% extends "base.html" %}

{% block title %}Smazat kontejner{% endblock %}

{% block head %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <h2 class="mb-4">Smazat kontejner "{{ container.name }}"?</h2>
            <p class="text-muted mb-4">
                Tato akce je nevratná. Všechna pravidla uvnitř kontejneru budou také smazána.
            </p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <button type="submit" class="btn btn-danger">Ano, smazat</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Zrušit</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
